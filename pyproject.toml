[project]
name = "awesome-kde-system-monitor"
version = "1.0.0"
description = "Custom pages for KDE Plasma System Monitor with auto-adapting sensor generator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pygobject",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[project.scripts]
generate-pages = "generate_pages.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generate_pages"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
